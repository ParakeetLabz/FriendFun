<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error 404 — FunTopia</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: linear-gradient(160deg, #2a1650 0%, #1a1a2e 55%, #12081f 100%);
    color: #fff;
    font-family: 'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }
  /* hand-drawn wobbly border, like a marker line that overshoots */
  .sketch-border {
    border: 3px solid #fff;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }
  /* the sketch image; the smiling face in its top-left corner is the Go Back button */
  .sketch-wrap {
    position: relative;
    width: min(720px, 92vw);
    margin: 10px auto 0;
  }
  .sketch-img {
    width: 100%;
    height: auto;
    display: block;
  }
  .face-btn {
    position: absolute;
    left: 0;
    top: 0;
    width: 18%;
    height: 30%;
    background: transparent;
    border: 3px solid transparent;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    cursor: pointer;
    padding: 0;
  }
  .face-btn:hover, .face-btn:focus-visible {
    border-color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.06);
    outline: none;
  }
  .oops {
    font-size: clamp(19px, 4.5vw, 26px);
    color: #e9d5ff;
    margin: 14px 0 26px;
    transform: rotate(-1deg);
    max-width: 560px;
  }
  .btn-back {
    display: inline-block;
    font-family: inherit;
    font-size: clamp(21px, 5vw, 27px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    padding: 14px 34px;
    cursor: pointer;
    transform: rotate(-1.5deg);
    box-shadow: 4px 5px 0 rgba(0, 0, 0, 0.35);
    transition: transform 0.12s ease;
  }
  .btn-back:hover { transform: rotate(-1.5deg) scale(1.06); }
  .btn-back:active { transform: rotate(-1.5deg) scale(0.97); box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35); }
  .lobby-link {
    display: inline-block;
    margin-top: 18px;
    color: #a5f3fc;
    font-size: 19px;
    text-decoration: underline wavy #22d3ee;
    text-underline-offset: 5px;
    transform: rotate(0.8deg);
  }
  .doodle {
    position: fixed;
    opacity: 0.55;
    pointer-events: none;
  }
  .doodle.star1 { top: 12%; right: 9%; width: 46px; transform: rotate(14deg); }
  .doodle.star2 { bottom: 14%; left: 7%; width: 36px; transform: rotate(-18deg); }
  .doodle.squig { bottom: 9%; right: 12%; width: 90px; transform: rotate(-6deg); }
  @media (max-width: 560px) {
    .face-btn { width: 22%; height: 34%; }
  }
</style>
</head>
<body>
  <!-- wobble filter: makes every stroke look hand-drawn, like the sketch -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.035" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
      </filter>
    </defs>
  </svg>

  <!-- little sketchy doodles -->
  <svg class="doodle star1" viewBox="0 0 48 48" aria-hidden="true"><g filter="url(#wobble)" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 L28 18 L42 20 L30 29 L34 43 L24 34 L14 43 L18 29 L6 20 L20 18 Z"/></g></svg>
  <svg class="doodle star2" viewBox="0 0 48 48" aria-hidden="true"><g filter="url(#wobble)" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4 L28 18 L42 20 L30 29 L34 43 L24 34 L14 43 L18 29 L6 20 L20 18 Z"/></g></svg>
  <svg class="doodle squig" viewBox="0 0 90 30" aria-hidden="true"><g filter="url(#wobble)" fill="none" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"><path d="M4 16 Q 16 4, 28 16 T 52 16 T 76 16 T 88 14"/></g></svg>

  <main>
    <!-- the user's own hand-drawn sketch: Error, 404, and the blocky character.
         The smiling face in the sketch's top-left corner is the Go Back button. -->
    <div class="sketch-wrap">
      <img class="sketch-img" src="/img/sketch-404.png" alt="Hand-drawn sketch: Error 404 with a blocky FunTopia character">
      <button class="face-btn" type="button" onclick="goBack()" aria-label="Go back" title="Go back"></button>
    </div>

    <p class="oops">Oops! This page got lost in the blocks.</p>
    <button class="btn-back sketch-border" type="button" onclick="goBack()">&#8592; Go Back</button>
    <br>
    <a class="lobby-link" href="/#/home">or head back to the lobby &rarr;</a>
  </main>

  <script>
    function goBack() {
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = '/#/home'; }
    }
  </script>
</body>
</html>
