  <script type="importmap">{ "imports": { "three": "/three/build/three.module.min.js", "three/addons/": "/three/examples/jsm/" } }</script>
<style>
.addon-list{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.addon-card{background:var(--card,#fff);border:1px solid var(--border,#e0e0e0);border-radius:12px;padding:16px}
.addon-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.addon-head h2{margin:0 0 4px;font-size:1.2em}
.addon-perms{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.addon-perms.disabled{opacity:.4;pointer-events:none}
.addon-perm{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.addon-perm input{margin-top:4px}
.switch{position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#ccc;border-radius:26px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:#4caf50}
.switch input:checked+span:before{transform:translateX(22px)}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>
  <script type="module" src="/js/app.js?v=collab26"></script>
</body>
</html>
