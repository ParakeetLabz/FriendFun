<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FunTopia</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f0a1e; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 35%, #3b1d78, #0f0a1e 70%); color: #fff; transition: opacity .4s; z-index: 2; }
  #splash h1 { margin: 0; font-size: clamp(34px, 8vw, 64px); letter-spacing: 1px; text-shadow: 0 4px 18px rgba(255,117,24,.55); }
  #splash .bar { width: 160px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  #splash .bar i { display: block; height: 100%; width: 40%; background: #ff7518; border-radius: 3px; animation: slide 1s ease-in-out infinite alternate; }
  @keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
  #splash.gone { opacity: 0; pointer-events: none; }
  #full { position: fixed; right: 10px; bottom: 10px; z-index: 3; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.55); text-decoration: none; border: 1px solid rgba(255,255,255,.25); }
  #full:hover { background: rgba(255,117,24,.85); }
</style>
</head>
<body>
<div id="splash"><h1>FunTopia</h1><div class="bar"><i></i></div></div>
<iframe id="game" title="FunTopia" allow="fullscreen; autoplay; microphone; camera; gamepad; clipboard-write" allowfullscreen></iframe>
<a id="full" href="/" target="_blank" rel="noopener">Open full site ↗</a>
<script>
  // #FunTopia (or nothing) opens the lobby; a real route like #/games/<id> passes straight through.
  var h = location.hash;
  var route = /^#\//.test(h) ? h : '#/home';
  var f = document.getElementById('game');
  f.addEventListener('load', function () { document.getElementById('splash').classList.add('gone'); });
  f.src = '/' + route;
  document.getElementById('full').href = '/' + route;
  setTimeout(function () { document.getElementById('splash').classList.add('gone'); }, 8000);
</script>
</body>
</html>
